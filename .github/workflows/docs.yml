name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'payload/**'
      - 'packs/**'
      - 'mkdocs.yml'
      - 'CHANGELOG.md'
      - 'scripts/build-docs-reference.mjs'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/check-docs-lists.py'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/build-docs-reference.mjs'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/check-docs-lists.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Generate the reference pages from payload/
        run: node scripts/build-docs-reference.mjs
      - run: mkdocs build --strict
      - name: No list rendered as paragraph text
        run: python scripts/check-docs-lists.py site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
